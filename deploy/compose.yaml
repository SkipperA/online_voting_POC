# The hosted demonstration: the origins, and a proxy in front of them.
#
# The origins publish no ports. Everything from outside arrives at Caddy,
# which terminates TLS and maps one hostname to each origin -- so the
# separation that stage 1 gets from ports is carried by hostnames, and
# nothing reaches an origin except through the name that identifies it.

services:
  ovpoc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Set from the update command, so the running container can say
        # which code it is. Unset it reaches the image as `unknown`,
        # which the configuration page reports as such rather than
        # guessing -- see `service/build.py`.
        OVPOC_REVISION: ${OVPOC_REVISION:-unknown}
    restart: unless-stopped
    environment:
      # Every origin addresses its neighbours under this domain, and
      # recognises itself by its own hostname rather than by a port --
      # which matters, because behind the proxy all eight arrive on 443.
      OVPOC_DOMAIN: ${OVPOC_DOMAIN:?set OVPOC_DOMAIN, e.g. diw.hu}
      # Clause S7: whether a qualified signature is itself the entitlement
      # to vote. Named here because `deploy/.env` feeds Compose's own
      # interpolation and nothing else -- a variable set there and absent
      # from this block is read by the operator as configuration and by
      # the office as not there at all, which is a setting that silently
      # does nothing. `tests/test_hosted_origins.py` is what notices.
      #
      # Empty by default rather than `:?`, because an office administering
      # the roll it was given is the article's design and must not need a
      # variable to be itself.
      OVPOC_OPEN_ENROLMENT: ${OVPOC_OPEN_ENROLMENT:-}
    volumes:
      # The elections: keys, registers, and the record each closed poll
      # writes. Outside the image on purpose -- rebuilding the container
      # must not discard an election.
      - ./election-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates; losing these re-requests them
      - caddy-config:/config
    environment:
      OVPOC_DOMAIN: ${OVPOC_DOMAIN:?set OVPOC_DOMAIN, e.g. diw.hu}
      # Nothing else. There was an `OVPOC_ADMIN_CIDRS` here, naming the
      # addresses allowed to reach `supervisor.` and `setup.`; the
      # Caddyfile explains why it is gone. It is removed rather than left
      # unused, because a variable that no longer does anything is read by
      # the next person as one that does -- and this one in particular had
      # a default of `127.0.0.1/32`, so forgetting it denied the operator
      # their own console without erroring.
    depends_on:
      - ovpoc

volumes:
  caddy-data:
  caddy-config:
