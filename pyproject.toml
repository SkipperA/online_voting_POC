[project]
name = "ovpoc"
version = "0.1.0"
description = "Proof of concept for an anonymous authenticated ballot system"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
# The HTTP layer of stage 1. Kept out of the core dependencies because
# `src/ovpoc` neither imports nor needs it: the protocol runs headless, and
# `demo.py` and `ext_demo.py` must keep working with none of this installed.
# httpx is not only the TestClient's transport: the office fetches a voter's
# qualified certificate over it at runtime (§3.2), so a deployment that
# installed `service` alone could not start. It was listed under `dev` until
# an install without `dev` was attempted for the first time.
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Validating a qualified electronic signature, for the second route to a
# token request. Separate because `src/ovpoc` neither imports nor needs it:
# the protocol declares the seam (`pdfrequest.SignatureValidation`) and
# `driver/qualified_signature.py` is the only thing that fills it, so an
# install without this still runs every test that uses a fake. It is the
# largest dependency in the project by some distance -- fifteen
# distributions, lxml and aiohttp among them, and a floor of
# `cryptography>=48` -- which is why it is opt-in and why the trust story
# for it is written out at the top of that module.
pades = ["pyhanko[etsi]>=0.38"]
dev = ["pytest>=8.0", "ovpoc[service]", "ovpoc[pades]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for the top-level packages that are deliberately not part of the
# distribution: `driver/` (external dependencies the design assumes) and
# `service/` (the transport, which may decide nothing about the protocol).
pythonpath = ["src", "tests", "."]
