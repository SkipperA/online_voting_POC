name: CI

# Two implementations have to agree about the wire format, and only a machine
# with both toolchains can check that.  Everything else here is runnable by
# hand; the `interop` job is the one that cannot be.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Suite, vectors, demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test suite
        run: python -m pytest -q
      - name: Committed vectors still match the code
        # Fails if behaviour changed without regenerating tests/vectors/.
        # The vectors are what the other implementations read, so drift here
        # is drift in the contract, not in a test fixture.
        run: python tools/golden_vectors.py --check
      - name: Independent recount of a real election
        run: python -m pytest tests/test_independent_verifier.py -q

      - name: Nothing dangerous is tracked
        # The state, where `tests/test_repository_hygiene.py` checks the
        # rule. That test may not run git -- the suite depends on what
        # `pyproject.toml` declares and on nothing else -- and here git
        # is a given, so this is the half that can read the index.
        run: |
          bad=$(git ls-files \
            | grep -E '^election-data/answer-keys/.*\.json$|^election-data/[0-9]{3}-|^deploy/election-data/|\.patch$' \
            || true)
          if [ -n "$bad" ]; then
            echo "these are tracked and must not be:"; echo "$bad"
            echo
            echo "An answer key is the solution to a published challenge."
            echo "A locally minted election belongs to the machine that"
            echo "minted it. See tests/test_repository_hygiene.py."
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null \
                | awk '$1 > 1024 {print $1" KB  "$2}' || true)
          if [ -n "$big" ]; then
            echo "tracked files over 1 MB:"; echo "$big"; exit 1
          fi

      - name: Regression anchors
        run: |
          python demo.py > /dev/null
          python ext_demo.py > /dev/null

  interop:
    name: TypeScript reads the same vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interop/package-lock.json
      - name: Install
        run: npm ci
        working-directory: interop
      - name: Verify the golden vectors from a second implementation
        run: npm run verify
        working-directory: interop

  sabotage:
    name: Every defence is still detected
    # Twenty-four mutations, each a full suite run.  Not on every push to every
    # branch; on pull requests and on anything reaching main, which is early
    # enough to catch a defence going quiet before it becomes permanent.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Disable each defence in turn
        run: python tools/sabotage.py
      - name: docs/sabotage.md is current
        # sabotage.py rewrites the report from the actual results, so an
        # unchanged file means every mutation is still caught by the same
        # tests.  Any difference -- a mutation gone undetected, a new one not
        # regenerated, a renamed test -- shows up here.
        run: git diff --exit-code docs/sabotage.md
